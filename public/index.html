<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Compliment Machine</title>
<style>
  :root {
    --bg: #1a0f1a;
    --accent1: #f472b6;
    --accent2: #fde68a;
    --text: #fff0f7;
    --muted: #a67c95;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 0%, #2b1626 0%, var(--bg) 65%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 {
    font-size: 2rem;
    margin: 0 0 6px;
    color: var(--accent1);
    text-shadow: 0 0 12px rgba(244,114,182,0.6);
  }
  .subtitle { color: var(--muted); margin-bottom: 18px; font-size: 0.9rem; }
  .card {
    background: rgba(244,114,182,0.06);
    border: 1px solid rgba(244,114,182,0.25);
    border-radius: 18px;
    padding: 26px;
    box-shadow: 0 0 40px rgba(244,114,182,0.1);
    margin-bottom: 18px;
  }
  label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(244,114,182,0.35);
    background: rgba(0,0,0,0.25);
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 14px;
  }
  button.action {
    padding: 12px 26px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(90deg, var(--accent1), #db2777);
    color: #1a0f1a;
    box-shadow: 0 0 20px rgba(244,114,182,0.5);
  }
  button.action:disabled { opacity: 0.35; cursor: not-allowed; }
  button.speak {
    margin-top: 14px;
    padding: 10px 22px;
    border: 1px solid rgba(244,114,182,0.4);
    border-radius: 999px;
    background: transparent;
    color: var(--accent1);
    font-weight: 600;
    cursor: pointer;
  }
  button.speak:disabled { opacity: 0.35; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  .compliment-text { font-size: 1.25rem; line-height: 1.6; margin-top: 18px; color: var(--accent2); }
  .footer-note { color: var(--muted); font-size: 0.8rem; text-align: center; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(244,114,182,0.3);
    border-top-color: var(--accent1);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>QVAC Compliment Machine</h1>
    <p class="subtitle">A personalized, spoken compliment written just for you. 100% on-device.</p>

    <div class="card">
      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" placeholder="e.g. Sam" />
      <label for="traitInput">Something you're proud of or working on (optional)</label>
      <input type="text" id="traitInput" placeholder="e.g. learning to paint" />
      <button class="action" id="generateBtn">Get a Compliment</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const nameInput = document.getElementById('nameInput');
    const traitInput = document.getElementById('traitInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    let lastCompliment = '';

    async function generate() {
      const name = nameInput.value.trim();
      if (!name) { status.textContent = 'Enter your name first.'; return; }
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Writing your compliment...';

      try {
        const res = await fetch('/api/compliment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, trait: traitInput.value.trim() }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        lastCompliment = data.compliment;
        status.textContent = '';
        resultBox.innerHTML = `
          <div class="compliment-text">"${escapeHtml(data.compliment)}"</div>
          <button class="speak" id="speakBtn">🔊 Read it aloud</button>
        `;
        document.getElementById('speakBtn').addEventListener('click', speak);
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    async function speak() {
      const btn = document.getElementById('speakBtn');
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'Speaking...';
      try {
        const res = await fetch('/api/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: lastCompliment }),
        });
        if (!res.ok) throw new Error('TTS failed');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.onended = () => { btn.disabled = false; btn.textContent = original; };
        audio.play();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = original;
        status.textContent = 'Error: ' + err.message;
      }
    }

    generateBtn.addEventListener('click', generate);
  </script>
</body>
</html>
